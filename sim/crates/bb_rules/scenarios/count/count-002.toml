id = "count-002"
title = "Bounced pitch taken in the zone is a ball"
rules = ["rules-spec 4.4 item 4"]
milestone = "M4"
tags = ["count", "pitch"]
[initial]
inning = 1

[[step]]
fact = "PitchDelivered"
t = 0
[[step]]
fact = "PitchCrossed"
t = 0.4
