  { fact = "RunnerPosition", t = 4.8, runner = "A.6", pos = [20.4, 22.3] },
  { fact = "GloveSecured", t = 4.9, fielder = "H.1B", pos = [19.0, 19.0] },
  { fact = "TagContact", t = 5.0, fielder = "H.1B", runner = "A.5", holding_ball = true, expect_events = [{ event = "RunnerOut", runner = "A.5", base = 2, kind = "Force" }] },
  { fact = "BaseTouched", t = 5.6, agent = "A.6", base = 1 },
  { fact = "PlayEndCheck", t = 7.0 },
]
expect = { outs = 1, bases = { first = "A.6" }, play = "Dead" }
