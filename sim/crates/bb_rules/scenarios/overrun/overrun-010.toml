id = "overrun-010"
title = "Batter-runner overruns first and is tagged a hundredth of a second after leaving the bag, before his next position sample: not out; the sample then shows him straight down the line"
# OBR 5.09(b)(4) exception: overrunning first and returning at once, he is not liable to be
# tagged. The tag falls between samples; with samples in the play he is protected from the
# moment he leaves first until a sample shows an attempt toward second (rules-spec 5.5), so the
# call does not depend on the sampling phase. Codex rules-passing review #3 (verified probe: a
# tag at 4.220 retired him, the same tag after a 4.215 sample did not).
rules = ["OBR 5.09(b)(4) exception", "rules-spec 5.5"]
milestone = "M4"
tags = ["overrun", "tag", "positions", "sampling"]
