id = "lob-001"
title = "Two out, runner on third: he touches home at 2.0 s, then the batter is forced out at first (the third out): the run does not count, and the runner, who neither scored nor was out, is left on base"
# OBR 5.08(a)(1): no run scores when the third out is the batter-runner put out before reaching
# first (a force). OBR 9.02(g): LOB is every runner who reached base and neither scored nor was put
# out, wherever he is when the inning ends: here he stands at home with a run that did not count.
rules = ["OBR 5.08(a)", "OBR 9.02(g)", "rules-spec 4.1", "rules-spec 11 I1", "rules-spec 11 I10"]
