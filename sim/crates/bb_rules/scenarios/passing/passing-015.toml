id = "passing-015"
title = "Fair counterpart of passing-013: the batter-runner runs past the runner from first while the fly is in the air, drops back behind him, and the ball then lands fair: the pass stands and he is out"
# OBR 5.09(b)(9): the pass happened (at 5.0) before the ball was ruled; only an uncaught foul
# would cancel it (OBR 5.06(c)(5)). The crossing has ended by the time the ball lands, so
# later positions alone cannot recover it (Codex rules-passing review #1, position probe).
rules = ["OBR 5.09(b)(9)", "OBR 5.06(c)(5)", "rules-spec 5.5"]
milestone = "M4"
tags = ["passing", "pending-ball", "positions"]
initial = { inning = 2, outs = 0, count = [1, 1], batter = "A.6", bases = { first = "A.4" } }
step = [
  { fact = "PitchDelivered", t = 0.0 },
  { fact = "BatContact", t = 0.42 },
  { fact = "BaseLeft", t = 0.6, agent = "A.4", base = 1 },
  { fact = "BaseTouched", t = 4.2, agent = "A.6", base = 1 },
  { fact = "BaseLeft", t = 4.3, agent = "A.6", base = 1 },
  # The runner from first holds 38% of the way to second; the batter-runner is 2 m past him.
  { fact = "RunnerPosition", t = 5.0, runner = "A.4", pos = [12.026, 26.768] },
  { fact = "RunnerPosition", t = 5.0, runner = "A.6", pos = [10.669, 28.126] },
  # Order restored: the batter-runner is back behind him.
  { fact = "RunnerPosition", t = 6.0, runner = "A.4", pos = [10.669, 28.126] },
  { fact = "RunnerPosition", t = 6.0, runner = "A.6", pos = [13.578, 25.217] },
  # Down fair in right-centre.
  { fact = "BallTouched", t = 6.5, what = "Ground", pos = [30.0, 70.0], expect_events = [
    { event = "FairFoulDecided", fair = true },
    { event = "PitchResult", call = "InPlay", balls = 1, strikes = 1 },
    { event = "RunnerPassed", runner = "A.6", passed = "A.4" },
    { event = "RunnerOut", runner = "A.6", base = 2, kind = "Tag" },
  ] },
  { fact = "BaseTouched", t = 7.5, agent = "A.4", base = 2 },
  { fact = "PlayEndCheck", t = 9.0 },
]
expect = { outs = 1, bases = { second = "A.4" }, play = "Dead" }
