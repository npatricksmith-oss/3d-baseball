id = "passing-024"
title = "Two out, runner on third: the batter is forced out at first, and the runner from third crosses home afterward: no run"
# OBR 5.08(a)(1): no run scores if the third out is the batter-runner put out at first; the
# runner's later touch of home (3.5, after the third out at 3.0) is the next half-inning's
# fact, where a stray touch must not score. (How he is counted in LOB is passing-023's gap.)
