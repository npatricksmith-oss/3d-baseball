id = "passing-018"
title = "Third-out variant of passing-009: one out, the catch makes two, and the runner from second crosses the lead runner going back to retouch: the third out, made before the retouch, so the lead runner's earlier home touch still stands"
# OBR 5.09(b)(9) and comment: out for passing at the crossing (7.3), while the lead runner is
# still going back (Codex rules-passing review #2). OBR 5.08(a): a time play; the lead runner's
# home touch (4.5) came before it. He left third early, but that is an appeal play (OBR
# 5.09(c)(1)): after the third out only a fourth-out appeal could take the run away, and v1 does
# not make one (rules-spec 6.4), so the run counts.
rules = ["OBR 5.09(b)(9) comment", "OBR 5.08(a)", "OBR 5.09(c)", "rules-spec 5.3", "rules-spec 5.5", "rules-spec 6.4"]
milestone = "M4"
tags = ["passing", "retouch", "lead-runner-action", "positions", "time-play"]
