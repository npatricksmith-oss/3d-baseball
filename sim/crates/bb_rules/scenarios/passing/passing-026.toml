id = "passing-026"
title = "A ball in doubt clears the fence after the batter-runner has passed the runner ahead of him: the batter is out for passing and scores no run; the runner he passed scores on the home run"
# OBR 5.09(b)(9): a runner who passes a preceding runner before that runner is out is out;
# the pass is made at 4.0 s while the ball is still in the air. OBR 5.06(b)(4)(A) awards the
# remaining runner home on the home run. The batter-runner, already out, is not awarded the
# bases. Codex rules-passing review, "Not done". The rules engine gets this right; what is
# still open is `bb_game` labelling the plate appearance a home run (PaResult::HomeRun), which
# a rules scenario cannot see.
rules = ["OBR 5.09(b)(9)", "OBR 5.06(b)(4)(A)", "rules-spec 5.5", "rules-spec 7.2"]
milestone = "M4"
tags = ["passing", "pending-ball", "homerun"]
initial = { inning = 4, outs = 0, batter = "A.6", bases = { first = "A.4" } }
step = [
  { fact = "PitchDelivered", t = 0.0 },
  { fact = "BatContact", t = 0.42 },
  { fact = "BaseLeft", t = 0.6, agent = "A.4", base = 1 },
  { fact = "BaseTouched", t = 2.5, agent = "A.4", base = 2 },
  { fact = "BaseTouched", t = 3.0, agent = "A.6", base = 1 },
  { fact = "BaseTouched", t = 3.9, agent = "A.6", base = 2 },
  # The runner from first stands on second (touched at 2.5, not yet left it); the batter-runner
  # arrives at third first, passing him.
  { fact = "BaseTouched", t = 4.0, agent = "A.6", base = 3 },
  { fact = "BallTouched", t = 4.8, what = "OutOfPlay", pos = [10.0, 125.0], in_flight = true, expect_events = [
    { event = "RunnerPassed", runner = "A.6", passed = "A.4" },
    { event = "RunnerOut", runner = "A.6" },
    { event = "RunScored", runner = "A.4" },
  ] },
]
expect = { score = [1, 0], outs = 1, bases = {} }
