id = "awards-019"
title = "A fielder catches a fair fly at the stands and the ball goes out of play with no throw: the batter is out, each runner gets one base"
rules = ["rules-spec 7.2", "OBR 5.06(b)(3)(C)"]
milestone = "M4"
tags = ["awards", "catch", "outofplay"]
[initial]
inning = 5
half = "top"
outs = 0
bases = { first = "A.1" }
batter = "A.2"

[[step]]
fact = "PitchDelivered"
t = 0.0
[[step]]
fact = "BatContact"
t = 0.42
[[step]]
fact = "GloveSecured"
t = 4.0
fielder = "H.LF"
pos = [-60.0, 70.0]
expect_events = [{ event = "Catch" }, { event = "RunnerOut", runner = "A.2", kind = "FlyOut" }]
[[step]]
fact = "BallTouched"
t = 4.5
what = "OutOfPlay"
pos = [-63.0, 70.0]
in_flight = true
expect_events = [{ event = "BallDead", reason = "OutOfPlay" }, { event = "RunnerAdvanced", runner = "A.1", from = 1, to = 2, cause = "Award" }]
expect_no_events = [{ event = "BallDead", reason = "HomeRun" }, { event = "BallDead", reason = "GroundRuleDouble" }, { event = "RunScored" }]
[expect]
bases = { second = "A.1" }
outs = 1
score = [0, 0]
