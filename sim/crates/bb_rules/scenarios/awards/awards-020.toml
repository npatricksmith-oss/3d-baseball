id = "awards-020"
title = "A fly already ruled fair that leaves the field in flight over foul ground (a fielder deflected it): two bases, not a home run"
rules = ["rules-spec 7.2", "OBR 5.05(a)(8)"]
milestone = "M4"
tags = ["awards", "groundrule", "outofplay"]
# The sim sends no glove-deflection fact yet, so it cannot produce this play; the ruling is
# pinned here. The fair ruling comes from the ball passing third on the fair side.
[initial]
inning = 2
half = "top"
bases = { first = "A.1" }
batter = "A.2"

[[step]]
fact = "PitchDelivered"
t = 0.0
[[step]]
fact = "BatContact"
t = 0.42
[[step]]
fact = "BallPassedBase"
t = 0.9
fair = true
expect_events = [{ event = "FairFoulDecided", fair = true }]
[[step]]
fact = "BallTouched"
t = 2.2
what = "OutOfPlay"
pos = [-40.0, 12.0]
in_flight = true
expect_events = [{ event = "BallDead", reason = "GroundRuleDouble" }, { event = "RunnerAdvanced", runner = "A.1", from = 1, to = 3, cause = "Award" }, { event = "RunnerAdvanced", runner = "A.2", from = 0, to = 2, cause = "Award" }]
expect_no_events = [{ event = "BallDead", reason = "HomeRun" }]
[expect]
bases = { second = "A.2", third = "A.1" }
score = [0, 0]
